# Prometheus: сбор с каждого Pod через kubernetes_sd discovery + правила алертов
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hw11-prometheus-config
  labels:
    app: hw11-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval }}
    rule_files:
    - /etc/prometheus/rules.yml
    scrape_configs:
    # Каждый Pod hw11 — отдельный target (instance = <pod ip>:8000)
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    # cAdvisor узла: CPU/RAM контейнеров
    - job_name: kubernetes-nodes-cadvisor
      scheme: https
      tls_config:
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
    # kubelet узла: метрики подов (микросервисные)
    - job_name: kubernetes-nodes-kubelet
      scheme: https
      tls_config:
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics
  rules.yml: |
    groups:
    - name: hw11-alerts
      rules:
      # Алерт 1: p95 времени до первой части ответа выше порога 2с, 2 минуты
      - alert: Hw11TtfcP95High
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(hw11_ttfc_seconds_bucket{job="kubernetes-pods"}[2m])))
          > {{ .Values.alerts.latencyP95Seconds }}
        for: {{ .Values.alerts.latencyFor }}
        labels:
          severity: warning
          service: hw11
        annotations:
          summary: "p95 TTFC выше {{ .Values.alerts.latencyP95Seconds }}с"
          description: "Время до первой части ответа p95 {{ printf "%.2f" .Values.alerts.latencyP95Seconds }}с удерживается {{ .Values.alerts.latencyFor }}. Проверить очередь и распределение по репликам."
      # Алерт 2: доля отказов (5xx) выше 5%, 1 минута
      - alert: Hw11ErrorRateHigh
        expr: >
          (sum by (pod) (rate(hw11_requests_total{job="kubernetes-pods",
              outcome=~"queue_full|not_ready|server_error"}[1m])))
          / (sum by (pod) (rate(hw11_requests_total{job="kubernetes-pods"}[1m])))
          > {{ .Values.alerts.errorRateFraction }}
        for: {{ .Values.alerts.errorFor }}
        labels:
          severity: critical
          service: hw11
        annotations:
          summary: "Доля отказов > {{ mul 100 .Values.alerts.errorRateFraction }}%"
          description: "Отношение отказов к общему числу запросов превышает порог {{ .Values.alerts.errorFor }}. Проверить переполнение очереди."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw11-prometheus
  labels:
    app: hw11-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hw11-prometheus
  template:
    metadata:
      labels:
        app: hw11-prometheus
    spec:
      serviceAccountName: hw11-prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v3.8.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
        ports:
        - containerPort: 9090
          name: http
        resources: {{ toYaml .Values.prometheus.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: hw11-prometheus-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hw11-prometheus
  labels:
    app: hw11-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hw11-prometheus
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hw11-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hw11-prometheus
subjects:
- kind: ServiceAccount
  name: hw11-prometheus
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: hw11-prometheus
  labels:
    app: hw11-prometheus
spec:
  selector:
    app: hw11-prometheus
  ports:
  - port: 9090
    name: http
{{- end }}
